name: container-full-stack
infra:
  provider: bicep
services:
  server:
    project: ./api
    host: containerapp
    language: docker
  client:
    project: ./client
    host: containerapp
    language: docker
hooks:
  postprovision:
    shell: sh
    run: |
      # Key mode: fetch the search admin key at runtime (never stored as plaintext output).
      # Keyless mode (USE_KEYLESS_AUTH=true): local auth is disabled, so skip the key and let
      # bulk-insert authenticate via DefaultAzureCredential using the signed-in deployer's Azure CLI identity, which infra granted Search data-plane roles.
      # SEARCH_SERVICE_NAME and AZURE_RESOURCE_GROUP are set by azd from bicep outputs/env.
      if [ "$USE_KEYLESS_AUTH" != "true" ]; then
        SEARCH_API_KEY=$(az search admin-key show \
          --service-name "$SEARCH_SERVICE_NAME" \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --query primaryKey -o tsv)
        export SEARCH_API_KEY
      fi
      export SEARCH_INDEX_NAME=good-books
      cd ./bulk-insert
      dotnet build
      if [ "$USE_KEYLESS_AUTH" = "true" ]; then
        # Keyless: role assignments can take ~1 min to propagate. Retry the seed on failure.
        n=0
        until dotnet run || [ "$n" -ge 5 ]; do
          n=$((n+1))
          echo "Seed attempt failed (likely RBAC role propagation); retrying in 30s ($n/5)..."
          sleep 30
        done
      else
        dotnet run
      fi
