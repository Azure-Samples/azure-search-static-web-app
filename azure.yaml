name: container-full-stack
infra:
  provider: bicep
services:
  server:
    project: ./api
    host: containerapp
    language: docker
  client:
    project: ./client
    host: containerapp
    language: docker
hooks:
  postprovision:
    - name: Bulk Insert Data
      command: |
        cd ./bulk-insert
        dotnet build
        dotnet run
